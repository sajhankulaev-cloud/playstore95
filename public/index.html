<script>

// Open wholesale storefront. Keep the same UI, but mark all public API calls
// so server-side price calculations use wholesale settings.
const __isWholesaleStorefront = window.location.pathname === "/ps95_optovik" || window.location.pathname.startsWith("/ps95_optovik/");
const __storefrontBasePath = __isWholesaleStorefront ? "/ps95_optovik" : "/";
if(__isWholesaleStorefront){
  document.body.classList.add("wholesaleStorefront");
  const __brand = document.querySelector("a.brand");
  if(__brand) __brand.setAttribute("href", "/ps95_optovik");
  const __nativeFetch = window.fetch.bind(window);
  window.fetch = function(input, init){
    try{
      const raw = (typeof input === "string") ? input : (input && input.url ? input.url : "");
      const u = new URL(raw, window.location.href);
      if(u.origin === window.location.origin && u.pathname.startsWith("/api/") && !u.pathname.startsWith("/api/admin/")){
        u.searchParams.set("wholesale", "1");
        if(typeof input === "string") input = u.pathname + u.search + u.hash;
        else input = new Request(u.href, input);
      }
    }catch(_e){}
    return __nativeFetch(input, init);
  };
}

const state={tab:"home",region:"TR",sort:"pop",platform:"",players:"",language:"",genres:[],search:"",page:1,until:"",subPage:"",allDeals:false,discountRates:{TR:[],UA:[],PL:[],IN:[]},topupCards:{TR:[],PL:[],IN:[]},useTurkeyTopupCards:false,useIndiaTopupCards:true,roundStep:50};

function shouldScrollToSubsGames(){
  return !!(state.scrollToSubsGames || window.location.hash === "#subs-games");
}

function scrollToSubsGamesIfRequested(){
  if(!shouldScrollToSubsGames()) return;
  const target = document.getElementById("subs-games") || document.querySelector(".subsGamesBlock");
  if(!target) return;
  setTimeout(()=>{
    target.scrollIntoView({behavior:"auto", block:"start"});
    state.scrollToSubsGames = false;
  }, 80);
}

const TAB_LABELS={home:"Главная",preorders:"Предзаказы",new:"Новинки",discounts:"Скидки",allgames:"Все игры",subs:"Подписки",topup:"Карты пополнения",bestsellers:"Лидеры продаж"};


function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g,(ch)=>(
    ch==="&"?"&amp;":ch==="<"?"&lt;":ch===">"?"&gt;":ch==='"'?"&quot;":"&#39;"
  ));
}

function optimizedPsImageUrl(src, width){
  const raw = String(src || "").trim();
  if(!raw) return raw;
  if(raw.startsWith("/")) return raw;
  try{
    const u = new URL(raw, window.location.href);
    const host = u.hostname.toLowerCase();
    const isPlayStationImage = host.endsWith("playstation.com") || host.endsWith("playstation.net") || host.includes("playstation");
    if(!isPlayStationImage) return raw;
    const w = Math.max(80, Math.min(700, Number(width || 322) || 322));
    return `/api/optimized-image?u=${encodeURIComponent(u.href)}&w=${w}`;
  }catch(_e){
    return raw;
  }
}

function gameCoverImg(src, attrs=""){
  const optimized = optimizedPsImageUrl(src, 322);
  return `<img src="${escapeHtml(optimized)}" alt="" loading="lazy" decoding="async" fetchpriority="low" width="161" height="161" referrerpolicy="no-referrer" ${attrs}>`;
}

function modalCoverImg(src){
  const optimized = optimizedPsImageUrl(src, 440);
  return `<img src="${escapeHtml(optimized)}" alt="" loading="lazy" decoding="async" fetchpriority="low" width="220" height="220" referrerpolicy="no-referrer">`;
}

function subsInfoItem(icon, content){
  const isPng = icon === 'psplus';
  return `<p class="subsInfoItem"><span class="subsInfoIcon${isPng ? ' subsInfoIconPngSlot' : ''}" aria-hidden="true">${isPng ? '' : subsIcon(icon)}</span><span class="subsInfoCopy">${content}</span></p>`;
}

function subsInfoList(items){
  return items.map(([icon, content])=>subsInfoItem(icon, content)).join('');
}

  if(!opts.keepSearch){
    state.search="";
    const si=document.getElementById("search");
    if(si) si.value="";
  }
  const platformSelect=document.getElementById("platform");
  if(platformSelect) platformSelect.value="";

  if(sortSelect) sortSelect.value="pop";
  document.querySelectorAll('#filterOverlay input[type="checkbox"]').forEach(x=>{ x.checked=false; });
}

function setActiveTab(tab, opts={}){
  const prevTab = state.tab;
  if(prevTab && prevTab !== tab && !opts.keepFilters){
    resetSectionFilters({keepSearch: tab === "search"});
  }
  state.tab = tab;
  if(tab!=="subs") state.subPage="";
  if(tab==="subs" && typeof opts.subPage!=="undefined") state.subPage=opts.subPage || "";
  // Reset only what should not bleed between sections
  if(!opts.keepPage) state.page = 1;
  if(tab !== "discounts") state.until = "";
  if(tab !== "discounts") state.allDeals = false;
  // When user explicitly opens the Discounts tab, default to the overview (no date filter)
  if(tab === "discounts" && !opts.keepUntil){
    state.until = "";
    state.allDeals = false;
  }

  // Adjust sort options for this section (and reset sort if needed)
  setSortOptionsForTab(tab);

  // Update URL
  try{
    const qs=new URLSearchParams(location.search);
    qs.set("tab", tab);
    if(tab==="subs" && state.subPage) qs.set("sub", state.subPage); else qs.delete("sub");
    // preserve filters
    qs.set("region", state.region);
    qs.set("sort", state.sort);
    if(state.platform) qs.set("platform", state.platform); else qs.delete("platform");
    if(state.players) qs.set("players", state.players); else qs.delete("players");
    if(state.language) qs.set("language", state.language); else qs.delete("language");
    if((state.genres||[]).length) qs.set("genres", state.genres.join(",")); else qs.delete("genres");
    if(state.search) qs.set("q", state.search); else qs.delete("q");
    if(state.until && tab==="discounts") qs.set("until", state.until); else qs.delete("until");
    if(state.allDeals && tab==="discounts") qs.set("all", "1"); else qs.delete("all");
    const __u = new URL(window.location.href);
    __u.pathname = __storefrontBasePath;
    __u.search = "?" + qs.toString();
    history.replaceState(null,"", __u.pathname + __u.search);
  }catch(_){}
  // Visual
  const tabs=[...document.querySelectorAll(".siteTab")];
  tabs.forEach(b=>{
    const is = b.dataset.tab===tab;
    b.classList.toggle("isActive", is);
    b.setAttribute("aria-selected", is ? "true":"false");
    b.tabIndex = is ? 0 : -1;
  });
  // Toggle discount UI visibility
  const dt=document.getElementById("discountTabs");
  const ad=document.getElementById("allDeals");
  if(dt) dt.style.display = (tab==="discounts") ? "" : "none";
  if(ad) ad.style.display = (tab==="discounts") ? "" : "none";

  // Discounts have two internal views: overview (banners + carousel) and list (date/all).
  // The exact view is set in load(); clear it here when leaving the discounts section.
  if(tab !== "discounts"){
    try{ delete document.body.dataset.discountsView; }catch(_){ document.body.removeAttribute("data-discounts-view"); }
  }
  // We'll set this precisely during load(), but clear it when leaving Discounts.
  if(tab !== "discounts"){
    delete document.body.dataset.discountsView;
  }

  const tabsShell=document.querySelector(".siteTabsShell");
  if(tabsShell) tabsShell.style.display = (tab === "search") ? "none" : "";

  // Let CSS react to current section (hide counters/sort on non-game pages)
  document.body.dataset.tab = tab;

  if(tab !== "search" && !state.search){
    try{ setSearchOpen(false); }catch(_){ }
  }

  // Ensure subscriptions grid layout does not leak into other sections
  const __gridEl = document.getElementById("grid");
  if(__gridEl) __gridEl.classList.toggle("gridSubs", tab==="subs");

  // Instant render for SPA sub-pages (so clicking subscription cards opens immediately without refresh)
  if(opts && opts.renderNow){
    if(tab === "subs"){
      renderSubscriptions();
      return;
    }
    if(tab === "multiplayer"){
      renderMultiplayerPage();
      return;
    }
    if(tab === "topup"){
      renderTopupPage();
      return;
    }
    if(tab === "new"){
      showEmptySection("Раздел пуст");
      return;
    }
  }
}

function enableFilterHorizontalScroll(scroller){
  if(!scroller || scroller.dataset.filterScrollReady) return;
  scroller.dataset.filterScrollReady = "1";
  let startX = 0, startY = 0, startLeft = 0, dragging = false, moved = false;

  scroller.addEventListener('wheel', (e)=>{
    if(scroller.scrollWidth <= scroller.clientWidth) return;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if(!delta) return;
    scroller.scrollLeft += delta;
    e.preventDefault();
  }, {passive:false});

  scroller.addEventListener('pointerdown', (e)=>{
    if(e.button !== undefined && e.button !== 0) return;
    dragging = true; moved = false;
    startX = e.clientX; startY = e.clientY; startLeft = scroller.scrollLeft;
  });
  scroller.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if(Math.abs(dx) > 3 && Math.abs(dx) >= Math.abs(dy)){
      if(!moved){
        moved = true;
        scroller.classList.add('is-dragging');
        try{ scroller.setPointerCapture(e.pointerId); }catch(_){ }
      }
      scroller.scrollLeft = startLeft - dx;
      e.preventDefault();
    }
  }, {passive:false});
  const stop = ()=>{
    if(!dragging) return;
    dragging = false;
    scroller.classList.remove('is-dragging');
    if(moved){
      scroller.dataset.dragMoved = '1';
      setTimeout(()=>{ delete scroller.dataset.dragMoved; }, 180);
    }
  };
  scroller.addEventListener('pointerup', stop);
  scroller.addEventListener('pointercancel', stop);
  scroller.addEventListener('lostpointercapture', stop);
  scroller.addEventListener('click', (e)=>{
    if(scroller.dataset.dragMoved === '1'){
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
}
function enableHomeDragScroll(scroller){
  if(!scroller || scroller.dataset.dragScrollReady) return;
  scroller.dataset.dragScrollReady="1";
  let startX=0, startLeft=0, lastX=0, lastT=0, velocity=0;
  let dragging=false, moved=false, raf=0;
  const dragPower=1.35;
  const stopMomentum=()=>{ if(raf) cancelAnimationFrame(raf); raf=0; };
  const startMomentum=()=>{
    stopMomentum();
    let v = velocity * 34;
    const maxV = 72;
    v = Math.max(-maxV, Math.min(maxV, v));
    const step=()=>{
      if(Math.abs(v) < 0.28){ raf=0; return; }
      scroller.scrollLeft -= v;
      v *= 0.935;
      raf=requestAnimationFrame(step);
    };
    if(Math.abs(v) > 1.0) raf=requestAnimationFrame(step);
  };

  scroller.addEventListener("pointerdown", (e)=>{
    if(e.button !== undefined && e.button !== 0) return;
    if(e.target && e.target.closest && e.target.closest('button, a, input, select, textarea, [role="button"]')) return;
    stopMomentum();
    dragging=true; moved=false;
    startX=lastX=e.clientX;
    startLeft=scroller.scrollLeft;
    lastT=performance.now(); velocity=0;
    scroller.classList.add("is-dragging");
    if(e.pointerType === "mouse") e.preventDefault();
  });

  scroller.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    const now=performance.now();
    const dx=e.clientX-startX;
    if(Math.abs(dx)>3) moved=true;
    scroller.scrollLeft=startLeft-(dx*dragPower);
    const dt=Math.max(1, now-lastT);
    velocity=((e.clientX-lastX)*dragPower)/dt;
    lastX=e.clientX; lastT=now;
    if(moved) e.preventDefault();
  });

  const endDrag=(e, allowTap=false)=>{
    if(!dragging) return;
    const wasMoved = moved;
    dragging=false;
    scroller.classList.remove("is-dragging");

    if(!wasMoved && allowTap){
      const banner = e && e.target && e.target.closest ? e.target.closest('.homeBanner[data-home-sub]') : null;
      if(banner && scroller.contains(banner)){
        const sub = banner.getAttribute('data-home-sub') || '';
        const toGames = banner.getAttribute('data-scroll-games') === '1';
        scroller.dataset.tapNavigated = "1";
        try{ e.preventDefault(); e.stopPropagation(); }catch(_){ }
        openSubPage(sub, toGames);
        setTimeout(()=>{ delete scroller.dataset.tapNavigated; }, 250);
        return;
      }
    }

    if(wasMoved){
      startMomentum();
      scroller.dataset.dragMoved="1";
      setTimeout(()=>{ delete scroller.dataset.dragMoved; }, 180);
    }
  };
  scroller.addEventListener("pointerup", (e)=>endDrag(e, true));
  scroller.addEventListener("pointercancel", (e)=>endDrag(e, false));
  scroller.addEventListener("lostpointercapture", (e)=>endDrag(e, false));
  scroller.addEventListener("click", (e)=>{
    if(scroller.dataset.dragMoved==="1" || scroller.dataset.tapNavigated==="1"){
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
}

async function appendHomeDiscountBanners(hero){
  if(!hero) return;
  try{
    const [dj, bj] = await Promise.all([
      fetch(`/api/discount-dates?region=${encodeURIComponent(state.region)}`, {cache:"no-store"}).then(r=>r.json()),
      fetch(`/api/discount-banners`, {cache:"no-store"}).then(r=>r.json()).catch(()=>({}))

    const dates = (dj && Array.isArray(dj.dates)) ? dj.dates : [];
    const banners = (bj && bj.banners && typeof bj.banners === "object") ? bj.banners : {};
    dates.forEach(d=>{
      const iso = String(d && d.date ? d.date : "").trim();

  grid.querySelectorAll('[data-home-view-all]').forEach(btn=>btn.addEventListener('click',()=>openHomeSection(btn.getAttribute('data-home-view-all')||'home')));
  const hero=grid.querySelector('#homeHero');
  await appendHomeDiscountBanners(hero);

  // Make top subscription banners clickable even when the horizontal
  // carousel drag handler captures pointer events.
  if(hero){
    let heroTapStart = null;
    hero.addEventListener('pointerdown', (e)=>{
      const banner = e.target && e.target.closest ? e.target.closest('.homeBanner[data-home-sub], .homeBanner[data-home-page], .homeBanner[data-discount-until]') : null;
      if(!banner || !hero.contains(banner)) { heroTapStart = null; return; }
      heroTapStart = { x:e.clientX, y:e.clientY, banner };
    }, true);
    hero.addEventListener('pointerup', (e)=>{
      if(!heroTapStart) return;
      const dx = Math.abs(e.clientX - heroTapStart.x);
      const dy = Math.abs(e.clientY - heroTapStart.y);
      const banner = heroTapStart.banner;
      heroTapStart = null;
      if(dx > 8 || dy > 8) return;
      e.preventDefault();
      e.stopPropagation();
      const discountUntil = banner.getAttribute('data-discount-until') || '';
      if(discountUntil){
        openDiscountDatePage(discountUntil);
      }else if(banner.getAttribute('data-home-page') === 'multiplayer'){
        openMultiplayerPage();
      }else if(banner.getAttribute('data-home-page') === 'topup'){
        openTopupPage();
      }else{
        const sub = banner.getAttribute('data-home-sub') || '';
        const toGames = banner.getAttribute('data-scroll-games') === '1';
        openSubPage(sub, toGames);
      }
    }, true);
  }

  // Top banner carousel: center active slide, bigger active size, autoplay + dots.
  if(hero){
    const heroSlides=[...hero.querySelectorAll('.homeBanner')];
    const dots=document.getElementById('homeHeroDots');
    let heroIndex=0;
    let heroTimer=null;
    const renderHero=()=>{
      const len=heroSlides.length;
      heroSlides.forEach((sl,i)=>{
        const prev=(heroIndex-1+len)%len;
        const next=(heroIndex+1)%len;
        sl.classList.toggle('is-active', i===heroIndex);
        sl.classList.toggle('is-prev', i===prev);
        sl.classList.toggle('is-next', i===next);
        sl.classList.toggle('is-hidden', i!==heroIndex && i!==prev && i!==next);
      });
      if(dots){
        dots.innerHTML=heroSlides.map((_,i)=>`<button type="button" class="${i===heroIndex?'active':''}" aria-label="Слайд ${i+1}" data-hero-dot="${i}"></button>`).join('');
        dots.querySelectorAll('[data-hero-dot]').forEach(b=>b.addEventListener('click',()=>{ heroIndex=Number(b.dataset.heroDot||0); renderHero(); restartHero(); }));
      }
    };
    const goHero=(dir)=>{ if(!heroSlides.length) return; heroIndex=(heroIndex+dir+heroSlides.length)%heroSlides.length; renderHero(); };
    const restartHero=()=>{ if(heroTimer) clearInterval(heroTimer); heroTimer=setInterval(()=>goHero(1),3000); };
    let hx=0, hy=0;
    hero.addEventListener('pointerdown',e=>{ hx=e.clientX; hy=e.clientY; });
    hero.addEventListener('pointerup',e=>{
      const dx=e.clientX-hx, dy=e.clientY-hy;
      if(Math.abs(dx)>35 && Math.abs(dx)>Math.abs(dy)){ goHero(dx<0?1:-1); restartHero(); }
    });
    renderHero(); restartHero();
  }
  grid.querySelectorAll('.homeRow').forEach(enableHomeDragScroll);

  const qsBase = (extra={}) => {
    const qs = new URLSearchParams({region:state.region, sort:"pop", page:"1"});
    if(state.platform) qs.set("platform", state.platform);
    if(state.players) qs.set("players", state.players);
    if(state.language) qs.set("language", state.language);
    if((state.genres||[]).length) qs.set("genres", state.genres.join(","));
    Object.entries(extra).forEach(([k,v])=>qs.set(k,String(v)));
    return qs.toString();
  };
  const fillRow = async (id, url) => {
    const row=document.getElementById(id);
    if(!row) return;
    row.innerHTML = `<div class="homeLoading">Загрузка...</div>`;
    try{
      const j=await fetch(url,{cache:"no-store"}).then(r=>r.json());
      row.innerHTML="";
      const defaultSourceTab = id === "homeBest" ? "allgames" : (id === "homeNew" ? "new" : (id === "homePreorders" ? "preorders" : (id === "homeDiscounts" ? "discounts" : state.tab)));
      (j.items||[]).slice(0,15).forEach(g=>{
        const sourceTab = g.sourceTab || defaultSourceTab;
        const showDate = sourceTab === "discounts";
        row.appendChild(buildCard(Object.assign({}, g, {__cardTab:sourceTab, __forceShowEdition: id === "homeBest"}), state.whatsapp||"", showDate));
      });
      if(!row.children.length) row.innerHTML = `<div class="homeLoading">Игры еще не добавлены</div>`;
    }catch(_){ row.innerHTML = `<div class="homeLoading">Игры еще не добавлены</div>`; }
  };

  const prices = await getSubsPrices();
  const renderHomeSubs = (months) => {
    const list=document.getElementById("homeSubsList");
    if(!list) return;
    const R=state.region;
    list.innerHTML = [
      homeSubCardHtml("essential", `/img/essential_${months}${Number(months)===1?'.jpg':(Number(months)===12?'.jpg':'.png')}`, "PS Plus Essential", renderSubOfferPrice(prices,R,"psplus","essential",months), HOME_PSPLUS_FEATURES.essential),
      homeSubCardHtml("extra", `/img/extra_${months}.png`, "PS Plus Extra", renderSubOfferPrice(prices,R,"psplus","extra",months), HOME_PSPLUS_FEATURES.extra),
      homeSubCardHtml("deluxe", `/img/deluxe_${months}.png`, "PS Plus Deluxe", renderSubOfferPrice(prices,R,"psplus","deluxe",months), HOME_PSPLUS_FEATURES.deluxe),
    ].join("");
    list.querySelectorAll('[data-home-sub]').forEach(btn=>btn.addEventListener('click',()=>openSubPage(btn.getAttribute('data-home-sub')||'')));
  };
  const renderHomeEa = (months) => {
    const list=document.getElementById("homeEaList");
    if(!list) return;
    const R=state.region;
    list.innerHTML = homeSubCardHtml("eaplay", `/img/eaplay_${months}.png`, "EA Play", renderSubOfferPrice(prices,R,"eaplay","",months), HOME_EAPLAY_FEATURES);
    list.querySelectorAll('[data-home-sub]').forEach(btn=>btn.addEventListener('click',()=>openSubPage(btn.getAttribute('data-home-sub')||'', true)));
  };
  renderHomeSubs(1);
  renderHomeEa(1);
  grid.querySelectorAll('.homeSubTabs button').forEach(btn=>btn.addEventListener('click',()=>{
    const group=btn.dataset.subtabs || 'psplus';
    grid.querySelectorAll(`.homeSubTabs button[data-subtabs="${group}"]`).forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if(group === 'eaplay') renderHomeEa(Number(btn.dataset.months||1));
    else renderHomeSubs(Number(btn.dataset.months||1));
  }));

  await Promise.all([
    fillRow("homeBest", "/api/bestsellers?"+qsBase({limit:15})),
    fillRow("homeNew", "/api/newreleases?"+qsBase({perPage:15})),
    fillRow("homePreorders", "/api/preorders?"+qsBase({perPage:15})),
    fillRow("homeDiscounts", "/api/games?"+qsBase({perPage:15})),
  ]);
}



async function renderMultiplayerPage(){
  document.body.dataset.tab="multiplayer";
  try{ delete document.body.dataset.discountsView; }catch(_){ document.body.removeAttribute("data-discounts-view"); }
  const dt=document.getElementById("discountTabs");
  const ad=document.getElementById("allDeals");
  const grid=document.getElementById("grid");
  const pager=document.getElementById("pager");
  const emptyBox=document.getElementById("emptyBox");
  if(dt){ dt.innerHTML=""; dt.style.display="none"; }
  if(ad){ ad.innerHTML=""; ad.style.display="none"; }
  if(emptyBox) emptyBox.style.display="none";
  if(!grid) return;
  grid.classList.remove("gridSubs", "searchResults");
  grid.innerHTML = `<section class="fullListPage multiplayerPage"><h1 class="multiplayerTitle">Игры для нескольких игроков</h1><div class="multiplayerToolbar"><button class="btnGhost" type="button" id="multiplayerBackBtn">← На главную</button><div class="fullListCount" id="multiplayerCount">Загрузка...</div></div><div class="grid fullListGrid" id="multiplayerGrid"></div></section>`;
  const back=document.getElementById("multiplayerBackBtn");
  if(back) back.onclick=()=>{ window.location.href=__storefrontBasePath; };
  const list=document.getElementById("multiplayerGrid");
  const count=document.getElementById("multiplayerCount");
  const renderPager=(total, perPage)=>{
    if(!pager) return;
    pager.innerHTML="";
    const totalPages=Math.max(1, Math.ceil((total||0)/(perPage||24)));
    if(totalPages<=1) return;
    const mk=(label,page,disabled=false,active=false)=>{
      const b=document.createElement("button");
      b.className="pagerBtn"+(active?" active":"");
      b.textContent=label;
      b.disabled=disabled;
      b.onclick=()=>{state.page=page; renderMultiplayerPage(); scrollTo(0,0);};
      return b;
    };
    pager.appendChild(mk("‹", Math.max(1,state.page-1), state.page===1));
    const start=Math.max(1,state.page-1);
    const end=Math.min(totalPages,state.page+1);
    if(start>1) pager.appendChild(mk("1",1,false,state.page===1));
    if(start>2){ const dots=document.createElement("span"); dots.className="pagerDots"; dots.textContent="…"; pager.appendChild(dots); }
    for(let p=start;p<=end;p++) pager.appendChild(mk(String(p),p,false,p===state.page));
    if(end<totalPages-1){ const dots=document.createElement("span"); dots.className="pagerDots"; dots.textContent="…"; pager.appendChild(dots); }
    if(end<totalPages) pager.appendChild(mk(String(totalPages),totalPages,false,state.page===totalPages));
    pager.appendChild(mk("›", Math.min(totalPages,state.page+1), state.page===totalPages));
  };
  try{
    const perPage=24;
    const qs=new URLSearchParams({region:state.region, page:String(state.page||1), perPage:String(perPage)});
    if(state.platform) qs.set("platform", state.platform);
    if(state.players) qs.set("players", state.players);
    if(state.language) qs.set("language", state.language);
    if((state.genres||[]).length) qs.set("genres", state.genres.join(","));
    const j=await fetch("/api/multiplayer?"+qs.toString(),{cache:"no-store"}).then(r=>r.json());
    if(j && (j.total||0)>0 && (j.items||[]).length===0 && state.page>1){
      state.page=Math.max(1, Math.ceil((j.total||0)/(j.perPage||perPage)));
      return renderMultiplayerPage();
    }
    if(count) count.textContent=`Найдено игр: ${j.total||0}`;
    if(list){
      list.innerHTML="";
      (j.items||[]).forEach(g=>list.appendChild(buildCard(Object.assign({}, g, {__cardTab:(g.sourceTab || "allgames"), __forceShowEdition:true}), state.whatsapp||"", false)));
      if(!list.children.length) list.innerHTML=`<div class="homeLoading">Игры еще не добавлены</div>`;
    }
    renderPager(j.total||0, j.perPage||perPage);
  }catch(_){
    if(count) count.textContent="Найдено игр: 0";
    if(list) list.innerHTML=`<div class="homeLoading">Игры еще не добавлены</div>`;
    if(pager) pager.innerHTML="";
  }
}

let __subsPricesCache = null;
async function getSubsPrices(){
  if(__subsPricesCache) return __subsPricesCache;
  try{
    const r = await fetch("/api/subscriptions-prices", { cache:"no-store" });
    const j = await r.json();
    __subsPricesCache = j || {};
    return __subsPricesCache;
  }catch(_){
    __subsPricesCache = {};
    return __subsPricesCache;
  }
}

function getSubPrice(prices, region, kind, tier, months){
  const R = String(region||"TR").toUpperCase();
  const m = String(months);
  if(kind==="psplus"){
    return Number(prices?.[R]?.psplus?.[tier]?.[m]) || 0;
  }
  if(kind==="eaplay"){
    return Number(prices?.[R]?.eaplay?.[m]) || 0;
  }
  return 0;
}

function getSubDiscountPrice(prices, region, kind, tier, months){
  if(Number(months) !== 12) return 0;
  const R = String(region||"TR").toUpperCase();
  if(kind==="psplus"){
    return Number(prices?.[R]?.psplus?.[tier]?.discount12) || 0;
  }
  if(kind==="eaplay"){
    return Number(prices?.[R]?.eaplay?.discount12) || 0;
  }
  return 0;
}

function getSubFinalPrice(prices, region, kind, tier, months){
  const base = getSubPrice(prices, region, kind, tier, months);
  const discount = getSubDiscountPrice(prices, region, kind, tier, months);
  return discount > 0 ? discount : base;
}

function renderSubOfferPrice(prices, region, kind, tier, months){
  const base = getSubPrice(prices, region, kind, tier, months);
  const discount = getSubDiscountPrice(prices, region, kind, tier, months);
  if(discount > 0 && base > 0){
    return `<span class="subOfferPriceOld">${fmtRub(base)}</span><span class="subOfferPriceNew">${fmtRub(discount)}</span>`;
  }
  return base ? fmtRub(base) : "—";
}

let __subGamesCache = {};
async function getSubscriptionGames(sub){
  const key = `${String(sub||"")}|${String(state.region||"TR").toUpperCase()}`;
  if(__subGamesCache[key]) return __subGamesCache[key];
  try{
    const qs = new URLSearchParams({ sub: String(sub||""), region: String(state.region||"TR") });
    const r = await fetch(`/api/subgames?${qs.toString()}`, { cache:"no-store" });
    const j = await r.json();
    const items = Array.isArray(j.items) ? j.items : [];
    __subGamesCache[key] = items;
    return items;
  }catch(_){
    __subGamesCache[key] = [];
    return [];
  }
}

function initTabsUI(){
  const scroller=document.getElementById("siteTabs");
  const left=document.querySelector(".tabsArrowLeft");
  const right=document.querySelector(".tabsArrowRight");
  if(!scroller) return;

  const update=()=>{
    const max = scroller.scrollWidth - scroller.clientWidth;
    const x = scroller.scrollLeft;
    const canLeft = x > 4;
    const canRight = x < (max - 4);
    if(left) left.style.visibility = canLeft ? "visible":"hidden";
    if(right) right.style.visibility = canRight ? "visible":"hidden";
  };

  const scrollByAmount=(dir)=>{
    const amt = Math.max(120, Math.floor(scroller.clientWidth*0.8));
    scroller.scrollBy({left: dir*amt, behavior:"smooth"});
  };

  if(left) left.onclick=()=>scrollByAmount(-1);
  if(right) right.onclick=()=>scrollByAmount(1);

  // Tabs click
  document.querySelectorAll(".siteTab").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      setActiveTab(btn.dataset.tab || "discounts");
      load();
    });
  });

  scroller.addEventListener("scroll", update, {passive:true});
  window.addEventListener("resize", update);
  // Initial
  update();
  // Ensure active tab is visible
  const active = document.querySelector('.siteTab.isActive');
  if(active) active.scrollIntoView({inline:"center", block:"nearest"});
}

function initQuickSearchDragScroll(){
  const scroller=quickSearchResultsEl;
  if(!scroller || scroller.__dragReady) return;
  scroller.__dragReady=true;
  let down=false;
  let startX=0;
  let startLeft=0;
  let moved=false;
  scroller.addEventListener("mousedown",(e)=>{
    if(e.button!==0) return;
    down=true; moved=false; startX=e.clientX; startLeft=scroller.scrollLeft;
    scroller.classList.add("isDragging");
  });
  window.addEventListener("mousemove",(e)=>{
    if(!down) return;
    const dx=e.clientX-startX;
    if(Math.abs(dx)>3) moved=true;
    scroller.scrollLeft=startLeft-dx;
  });
  window.addEventListener("mouseup",()=>{
    down=false;
    scroller.classList.remove("isDragging");
    setTimeout(()=>{ moved=false; },0);
  });
  scroller.addEventListener("click",(e)=>{
    if(moved){
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);
}

function fmtRub(n){try{return new Intl.NumberFormat("ru-RU").format(n)+" ₽";}catch(e){return n+" ₽";}}
function formatDateDMY(dateStr) {
  if (!dateStr) return "";
  const s = String(dateStr).trim();

  // YYYY-MM-DD (например: 2026-01-07)
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return ` ${m[3]}.${m[2]}.${m[1]}`;

  // DD.MM.YYYY (если вдруг уже так)
  const m2 = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (m2) return ` ${m2[1]}.${m2[2]}.${m2[3]}`;

  return "";
}

function releaseDateToYMD(dateStr){
  if(!dateStr) return "";
  const s = String(dateStr).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  return "";
}

function isFutureReleaseDate(dateStr){
  const ymd = releaseDateToYMD(dateStr);
  if(!ymd) return false;
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
  return ymd > today;
}

function formatDateRuLong(dateStr){
  if(!dateStr) return "";
  const s=String(dateStr).trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  let y,mm,dd;
  if(m){ y=Number(m[1]); mm=Number(m[2]); dd=Number(m[3]); }
  else{
    const m2=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if(!m2) return "";
    dd=Number(m2[1]); mm=Number(m2[2]); y=Number(m2[3]);
  }
  const months=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const ddStr=String(dd).padStart(2,"0");
  const mon=months[Math.max(0,Math.min(11,mm-1))];
  return `До: ${ddStr} ${mon} ${y}`;
}

function pickCartRate(rules, price){
  const p=Number(price||0);
  for(const r of (rules||[])){
    const min=Number(r.min); const max=(r.max===null||typeof r.max==="undefined")?null:Number(r.max);
    if(Number.isFinite(min) && p>=min && (max===null || p<max)) return Number(r.rate)||1;
  }
  return (rules||[]).length ? (Number(rules[rules.length-1].rate)||1) : 1;
}
function roundCartDown(value, step){ const st=Number(step)||50; return Math.floor((Number(value)||0)/st)*st; }
function calcCartDiscount(items){
  const list=Array.isArray(items)?items:[];
  const oldTotal=list.reduce((s,x)=>s+(Number(x.finalPriceRub)||0),0);
  if(list.length<2) return {oldTotal, discount:0, total:oldTotal};
  const rules=(state.discountRates&&state.discountRates[state.region])||[];
  const total=list.reduce((s,x)=>{
    const storePrice=Number(x.storePrice||0);
    const basePrice=Number(x.finalPriceRub)||0;
    if(!storePrice) return s+Math.max(400, roundCartDown(basePrice, state.roundStep));
    const rate=pickCartRate(rules, storePrice);
    return s+Math.max(400, roundCartDown(storePrice*rate, state.roundStep));
  },0);
  return {oldTotal, discount:Math.max(0, oldTotal-total), total};
}

function calcTopupCartDetails(cards, price){
  const rawPrice=Number(price||0);
  const target=Math.ceil(rawPrice);
  const list=(Array.isArray(cards)?cards:[])
    .map(c=>({amount:Math.round(Number(c.amount)||0), rub:Number(c.rub)||0}))
    .filter(c=>c.amount>0 && c.rub>0)
    .sort((a,b)=>a.amount-b.amount || a.rub-b.rub);
  if(!target || !list.length) return {nominal:0, rub:0, price:rawPrice, left:0, cards:[]};

  const maxAmount=Math.max(...list.map(c=>c.amount));
  const limit=target+maxAmount;
  const inf=Number.POSITIVE_INFINITY;
  const dp=Array(limit+1).fill(inf);
  const cnt=Array(limit+1).fill(inf);
  const prev=Array(limit+1).fill(null);
  dp[0]=0;
  cnt[0]=0;

  for(let sum=0; sum<=limit; sum++){
    if(!Number.isFinite(dp[sum])) continue;
    for(let i=0;i<list.length;i++){
      const card=list[i];
      const next=sum+card.amount;
      if(next>limit) continue;
      const nextRub=dp[sum]+card.rub;
      const nextCnt=cnt[sum]+1;
      if(
        nextRub<dp[next] ||
        (nextRub===dp[next] && nextCnt<cnt[next])
      ){
        dp[next]=nextRub;
        cnt[next]=nextCnt;
        prev[next]={sum, idx:i};
      }
    }
  }

  let bestRub=inf, bestSum=inf, bestCnt=inf;
  for(let sum=target; sum<=limit; sum++){
    if(
      dp[sum]<bestRub ||
      (dp[sum]===bestRub && sum<bestSum) ||
      (dp[sum]===bestRub && sum===bestSum && cnt[sum]<bestCnt)
    ){
      bestRub=dp[sum];
      bestSum=sum;
      bestCnt=cnt[sum];
    }
  }
  if(!Number.isFinite(bestRub) || !Number.isFinite(bestSum)) return {nominal:0, rub:0, price:rawPrice, left:0, cards:[]};

  const byAmount=new Map();
  let cur=bestSum;
  while(cur>0 && prev[cur]){
    const step=prev[cur];
    const card=list[step.idx];
    const key=String(card.amount);
    const existing=byAmount.get(key) || {amount:card.amount, rub:card.rub, qty:0};
    existing.qty += 1;
    byAmount.set(key, existing);
    cur=step.sum;
  }
  const combo=Array.from(byAmount.values())
    .sort((a,b)=>a.amount-b.amount)
    .map(c=>({amount:c.amount, rub:c.rub, qty:c.qty, totalRub:c.rub*c.qty}));

  return {nominal:bestSum, rub:bestRub, price:rawPrice, left:Math.max(0,bestSum-rawPrice), cards:combo};
}

async function refreshCartItemsFromServer(region){
  const R = String(region || state.region || "TR").toUpperCase();
  const stored = loadCart(R);
  if(!stored.length) return stored;
  const ids = stored.map(x=>String(x && x.id || "").trim()).filter(Boolean);
  if(!ids.length) return stored;
  try{
    const r = await fetch(`/api/cart-items?region=${encodeURIComponent(R)}&ids=${encodeURIComponent(ids.join(","))}`, { cache:"no-store" });
    const j = await r.json().catch(()=>null);
    if(!r.ok || !j || !j.ok || !Array.isArray(j.items)) return stored;
    const freshById = new Map(j.items.map(x=>[String(x.id), x]));
    let changed = false;
    const merged = stored.map(oldItem=>{
      const fresh = freshById.get(String(oldItem && oldItem.id));
      if(!fresh) return oldItem;
      const normalized = normalizeGameForCart(Object.assign({}, oldItem, fresh));
      if(JSON.stringify(normalized) !== JSON.stringify(oldItem)) changed = true;
      return normalized;
    });
    if(changed) saveCart(R, merged);
    return merged;
  }catch(_e){
    return stored;
  }
}

function isInCart(gameId, region){
  const r = (region || state.region);
  return loadCart(r).some(x => String(x.id) === String(gameId));
}

function setBuyBtnState(btn, inCart){
  if(!btn) return;
  const defLabel = btn.getAttribute("data-cart-label") || "В корзину";
  const inLabel = btn.getAttribute("data-cart-label-in") || "В корзине";
  btn.classList.toggle("isInCart", !!inCart);
  const label = inCart ? inLabel : defLabel;
  if((defLabel || "").toLowerCase().includes("корз")) btn.innerHTML = cartButtonHtml(label);
  else btn.textContent = label;
  btn.setAttribute("aria-pressed", String(!!inCart));
}

function refreshAllBuyButtons(){
  // update all buttons on page (cards + modal) for current region
  document.querySelectorAll("button[data-cart-game]").forEach(btn=>{
    const id = btn.getAttribute("data-cart-game");
    setBuyBtnState(btn, isInCart(id, state.region));
  });
}

function addToCart(game){
  if(!game || !game.id) return;
  const region = state.region;
  const items = loadCart(region);
  const normalized = normalizeGameForCart(game);
  const idx = items.findIndex(x => String(x.id) === String(normalized.id));
  if(idx >= 0) items[idx] = normalized;
  else items.push(normalized);
  saveCart(region, items);
  updateCartCount();
  refreshAllBuyButtons();
  if(isCartOpen()) renderCart();
}

function removeFromCart(gameId){
  const region = state.region;
  const items = loadCart(region).filter(x => String(x.id) !== String(gameId));
  saveCart(region, items);
  updateCartCount();
  refreshAllBuyButtons();
  if(isCartOpen()) renderCart();
}

function clearCart(){
  saveCart(state.region, []);
  updateCartCount();
  refreshAllBuyButtons();
  if(isCartOpen()) renderCart();
}

function subBadgeHtml(subVal){
  const s = String(subVal||"").trim().toLowerCase();
  const isEa = (s==="eaplay" || s==="ea_play" || s==="ea");
  const isEssential = (s==="psplus_essential" || s==="ps_plus_essential" || s==="essential");
  const isExtra = (s==="psplus_extra" || s==="ps_plus_extra" || s==="extra" || s==="psplus");
  const isDeluxe = (s==="psplus_deluxe" || s==="ps_plus_deluxe" || s==="deluxe");
  if(!s || (!isEa && !isEssential && !isExtra && !isDeluxe)) return "";
  const EA_ICON = "/img/ea1.png";
  const PSPLUS_ICON = "/img/psplus1.png";
  const icon = isEa ? EA_ICON : PSPLUS_ICON;
  const text = isEa ? "Доступна в EaPlay" : (isEssential ? "Доступна в Essential" : (isDeluxe ? "Доступна в Deluxe" : "Доступна в Extra"));
  return `<div class="cartSub"><img class="subIcon" src="${icon}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'"/><span>${text}</span></div>`;
}

async function renderCart(){
  const body = document.getElementById("cartBody");
  const totalEl = document.getElementById("cartTotal");
  const regionEl = document.getElementById("cartRegion");
  const hintEl = document.getElementById("cartHint");
  const buyBtn = document.getElementById("cartBuyBtn");
  const clearBtn = document.getElementById("cartClearBtn");

  if(regionEl) regionEl.textContent = `(${state.region})`;

  let items = loadCart(state.region);
  items = await refreshCartItemsFromServer(state.region);
  updateCartCount();
  refreshAllBuyButtons();
  const usesTopup = shouldUseTopupCartCheckout(state.region);
  const storeTotal = items.reduce((s,x)=>s+(Number(x.storePrice)||0),0);
  const topupDetails = usesTopup ? calcTopupCartDetails((state.topupCards&&state.topupCards[state.region])||[], storeTotal) : null;
  const totals = usesTopup ? {oldTotal:0, discount:0, total:Number(topupDetails&&topupDetails.rub||0)} : calcCartDiscount(items);

  const oldTotalEl = document.getElementById("cartOldTotal");
  const discountEl = document.getElementById("cartDiscount");
  const discountRowEl = document.getElementById("cartDiscountRow");
  const oldTotalRowEl = document.getElementById("cartOldTotalRow");
  if(totalEl) totalEl.textContent = fmtRub(totals.total);
  if(oldTotalEl) oldTotalEl.textContent = fmtRub(totals.oldTotal);
  if(discountEl) discountEl.textContent = `- ${fmtRub(totals.discount)}`;
  if(oldTotalRowEl) oldTotalRowEl.style.display = (!usesTopup && totals.discount > 0) ? "flex" : "none";
  if(discountRowEl) discountRowEl.style.display = (!usesTopup && totals.discount > 0) ? "flex" : "none";

  if(clearBtn) clearBtn.disabled = items.length === 0;
  if(buyBtn) buyBtn.disabled = items.length === 0;

  if(!body) return;

  if(!items.length){
    body.innerHTML = `<div class="cartEmpty">В корзине пусто</div>`;
    if(hintEl) hintEl.textContent = "";
    return;
  }

  body.innerHTML = "";
  items.forEach(item=>{
    const row = document.createElement("div");
    row.className = "cartItem";
    const priceHtml = usesTopup ? formatStoreCurrency(item.storePrice || 0, state.region) : fmtRub(item.finalPriceRub || 0);
    const metaHtml = usesTopup ? "" : `
        <div class="cartMeta">
          <div class="cartDisc">${item.discPerc ? `-${item.discPerc}%` : ""}</div>
          <div class="cartUntil">${item.discountedUntil ? escapeHtml(formatDateRuLong(item.discountedUntil)) : ""}</div>
        </div>`;
    row.innerHTML = `
      <div class="cartItemLeft">
        <div class="cartCover">
          ${item.cover ? gameCoverImg(item.cover, `onerror="this.style.display='none'"`) : `<div class="noCoverBox">NO COVER</div>`}
        </div>
        <div class="cartPlatforms">${item.platform || "PS4 / PS5"}</div>
      </div>
      <div class="cartItemRight">
        <div class="cartItemTop">
          <div class="cartItemTitle">${escapeHtml(item.name || "")}</div>
          <button class="cartRemove" type="button" aria-label="Удалить">×</button>
        </div>
        <div class="cartEdition">${escapeHtml(item.edition || "Standard Edition")}</div>
        ${usesTopup ? "" : subBadgeHtml(item.sub)}
        ${metaHtml}
        <div class="cartPriceRow">
          <div class="cartPrice">${priceHtml}</div>
        </div>
      </div>
    `;
    row.querySelector(".cartRemove").onclick = ()=>removeFromCart(item.id);
    body.appendChild(row);
  });

  if(usesTopup && topupDetails && Number(topupDetails.nominal||0)>0){
    body.appendChild(renderTopupCartSection(items, topupDetails));
  }
  if(hintEl) hintEl.textContent = "";
}

function normalizeWhatsAppBase(link){
  let base = String(link || "").trim();
  if(!base) return "https://wa.me/+79659556300";
  if(/^\+?\d[\d\s().-]*$/.test(base)){
    const phone = base.replace(/\D/g, "");
    return phone ? `https://wa.me/${phone}` : "https://wa.me/+79659556300";
  }
  if(/^https?:\/\//i.test(base)) return base;
  return "https://" + base.replace(/^\/+/, "");
}
function openWhatsAppMessage(message, baseLink){
  const base = normalizeWhatsAppBase(baseLink || state.whatsapp);
  const sep = base.includes("?") ? "&" : "?";
  window.open(base + sep + "text=" + encodeURIComponent(String(message || "")), "_blank");
}

async function buyCartWhatsApp(){
  const items = await refreshCartItemsFromServer(state.region);
  updateCartCount();
  refreshAllBuyButtons();
  if(!items.length) return;

  const usesTopup = shouldUseTopupCartCheckout(state.region);
  const storeTotal = items.reduce((s,x)=>s+(Number(x.storePrice)||0),0);
  const topupDetails = usesTopup ? calcTopupCartDetails((state.topupCards&&state.topupCards[state.region])||[], storeTotal) : null;
  const totals = usesTopup ? {oldTotal:0, discount:0, total:Number(topupDetails&&topupDetails.rub||0)} : calcCartDiscount(items);

  const lines = [];
  lines.push("Хочу купить игры:");
  lines.push(`Регион: ${state.region}`);
  lines.push("");
  items.forEach((g, i)=>{
    const parts = [];
    parts.push(`${i+1}) ${g.name}`);
    if(g.edition) parts.push(`Издание: ${g.edition}`);
    if(g.platform) parts.push(`Платформа: ${g.platform}`);
    if(!usesTopup && g.discPerc) parts.push(`Скидка: -${g.discPerc}%`);
    if(!usesTopup && g.discountedUntil) parts.push(String(formatDateRuLong(g.discountedUntil)).replace(/^До:\s*/,"Дата конца скидки: "));
    parts.push(`Цена: ${usesTopup ? formatStoreCurrency(g.storePrice || 0, state.region) : fmtRub(g.finalPriceRub || 0)}`);
    lines.push(parts.join("\n"));
    lines.push("");
  });
  if(usesTopup && topupDetails){
    lines.push(`Сумма игр в PS Store: ${formatStoreCurrency(storeTotal, state.region)}`);
    lines.push(`Карты для пополнения: ${formatStoreCurrency(topupDetails.nominal, state.region)}`);
    if(Array.isArray(topupDetails.cards) && topupDetails.cards.length){
      topupDetails.cards.forEach(card=>{
        const qty=Math.max(1, Math.round(Number(card.qty||1)));
        const rowRub=Number(card.totalRub || (Number(card.rub||0)*qty) || 0);
        lines.push(`- ${formatStoreCurrency(card.amount, state.region)} × ${qty}: ${fmtRub(rowRub)}`);
      });
    }
    lines.push(`Стоимость карт: ${fmtRub(topupDetails.rub)}`);
    if(Number(topupDetails.left||0)>0) lines.push(`${formatTopupLeftoverCurrency(topupDetails.left, state.region)} останутся на вашем аккаунте.`);
  }else if(totals.discount > 0){
    lines.push(`Старая цена: ${fmtRub(totals.oldTotal)}`);
    lines.push(`Скидка за 2+ игры: - ${fmtRub(totals.discount)}`);
  }
  lines.push(`Итого: ${fmtRub(totals.total)}`);

  openWhatsAppMessage(lines.join("\n"));
}

function buildCard(game, whatsapp, showUntil){
  const cardTab = game && game.__cardTab ? String(game.__cardTab) : state.tab;
  const isSearchMode = !!String(state.search || "").trim();
  const isPreorder = (cardTab === "preorders" && !isSearchMode) || !!game.isPreorder;
  const isNewRelease = !isPreorder && (cardTab === "new" || !!game.isNewRelease || game.sourceTab === "new");
  const div=document.createElement("div");
  div.className = (isPreorder ? "card card--preorder" : "card") + (isNewRelease ? " card--new" : "");
  const until = (showUntil && game.discountedUntil) ? formatDateDMY(game.discountedUntil) : "";
  const inCart = isInCart(game.id, state.region);
  const inWish = isInWishlist(game.id, state.region);
  const preorderBadge = isPreorder ? `<div class="preorderBadge" aria-label="Предзаказ">Предзаказ</div>` : "";
  const newBadge = isNewRelease ? `<div class="newBadge" aria-label="Новинка">Новинка</div>` : "";
  const compareButton = `<button class="compareBtn" type="button" aria-label="Сравнить регионы" title="Сравнить регионы">${subsIcon('compare')}</button>`;
  const showEdition = !!game.__forceShowEdition || cardTab !== "allgames" || !!String(state.search||"").trim();
  const editionHtml = showEdition && game.edition
    ? `<div class="cardEdition">${escapeHtml(game.edition)}</div>`
    : "";

  // For preorders we keep the same card structure as other pages,
  // but allow separate styling via .card--preorder.
  // Release date is shown only in the modal.
  const discountHtml = game.discPerc ? ("-"+game.discPerc+"%") : "";

  const priceRowHtml = isPreorder
    ? `<div class="row priceRow"><div class="price">${fmtRub(game.finalPriceRub)}</div><div class="discount">${discountHtml}</div></div>`
    : `<div class="row"><div class="discount">${discountHtml}</div><div class="price">${fmtRub(game.finalPriceRub)}</div></div>`;

  div.innerHTML=`
    <div class="coverWrap">
      <div class="platformStrip">${game.platform||"PS4 / PS5"}</div>
      ${preorderBadge}
      ${newBadge}
      ${compareButton}
      ${game.cover?gameCoverImg(game.cover, `onerror="this.style.display='none'"`):"<div style='font-weight:900;font-size:12px;opacity:.9'>NO COVER</div>"}
    </div>
    <div class="body-bar1">
      <p class="title">${game.name||""}</p>
      ${editionHtml}
      <div class="bottom">
      ${priceRowHtml}
      <div class="row cardActions"><button class="buyBtn buyBtn--card ${inCart?"isInCart":""}" data-cart-game="${game.id}" data-cart-label="В корзину" data-cart-label-in="В корзине" type="button" aria-pressed="${inCart?"true":"false"}">${cartButtonHtml(inCart?"В корзине":"В корзину")}</button><button class="wishBtn ${inWish?"isInWishlist":""}" data-wish-game="${game.id}" type="button" aria-label="В желаемое" aria-pressed="${inWish?"true":"false"}"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg></button></div>
      </div>
    </div>`;
  const cw = div.querySelector(".coverWrap");
  if(cw){ cw.style.cursor="pointer"; cw.onclick=()=>openGameModal(game); }
  div.querySelector(".buyBtn").onclick=(e)=>{
    if(e){ e.preventDefault(); e.stopPropagation(); }
    const nowInCart = isInCart(game.id, state.region);
    if(nowInCart) removeFromCart(game.id);
    else addToCart(game);
  };
  const compareBtn = div.querySelector(".compareBtn");
  if(compareBtn){ compareBtn.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); openRegionCompare(game); }; }
  const wishBtn = div.querySelector(".wishBtn");
  if(wishBtn){ wishBtn.onclick=(e)=>{ e.preventDefault(); e.stopPropagation(); toggleWishlist(game); setWishBtnState(wishBtn, isInWishlist(game.id, state.region)); }; }
  return div;
}


const REGION_COMPARE_LABELS={UA:"СНГ",TR:"Турция",PL:"Польша",IN:"Индия"};
function regionComparePriceHtml(g){
  const disc = Number(g && g.discPerc || 0);
  const old = Number(g && g.oldPriceRub || 0);
  const price = Number(g && g.finalPriceRub || 0);
  return `<div class="regionComparePriceLine">${disc ? `<span class="regionCompareDiscount">-${disc}%</span>` : ``}<div class="regionComparePrices">${old ? `<span class="regionCompareOld">${escapeHtml(fmtRub(old))}</span>` : ``}<span class="regionComparePrice">${price ? escapeHtml(fmtRub(price)) : '—'}</span></div></div>`;
}
function renderRegionCompareItems(items, activeRegion){
  const order=["UA","TR","PL","IN"];
  return order.map(R=>{
    const g = (items||[]).find(x=>String(x.region||'').toUpperCase()===R);
    if(!g){
      return `<div class="regionCompareItem isMissing"><div class="regionCompareRegion">${REGION_COMPARE_LABELS[R]}<span>${R}</span></div><div class="regionCompareMissing">Нет данных</div></div>`;
    }
    const active = String(activeRegion||'').toUpperCase()===R;
    return `<div class="regionCompareItem ${active?'isActive':''}">
      <div class="regionCompareRegion">${REGION_COMPARE_LABELS[R]}<span>${R}</span></div>
      <div class="regionCompareEdition">${escapeHtml(gmRuLabel(g.ru))}</div>
      ${regionComparePriceHtml(g)}
    </div>`;
  }).join('');
}
function openRegionCompare(game){
  const overlay=document.getElementById("regionCompareModal");
  const list=document.getElementById("regionCompareList");
  const title=document.getElementById("regionCompareTitle");
  const sub=document.getElementById("regionCompareSub");
  const platform=document.getElementById("regionComparePlatform");
  const discountDate=document.getElementById("regionCompareDiscountDate");
  const cover=document.getElementById("regionCompareCover");
  if(!overlay || !list) return;
  if(title) title.textContent = game && game.name ? game.name : "Сравнение";
  if(sub) sub.textContent = game ? gmEditionShortText(game) : "";
  if(platform) platform.textContent = game && game.platform ? game.platform : "PS4 / PS5";
  const setCompareDiscountDate = (until)=>{
    if(!discountDate) return;
    const v = String(until || "").trim();
    discountDate.textContent = v ? `Скидка до ${formatDateDMY(v)}` : "";
    discountDate.style.display = v ? "block" : "none";
  };
  setCompareDiscountDate(game && game.discountedUntil);
  if(cover){
    if(game && game.cover){ cover.innerHTML = `<img src="${escapeHtml(optimizedPsImageUrl(game.cover, 420))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`; }
    else cover.innerHTML = `<div class="regionCompareNoCover"></div>`;
  }
  list.innerHTML = `<div class="regionCompareLoading">Загрузка...</div>`;
  overlay.style.display="flex";
  document.body.classList.add("modalOpen");
  const qs=new URLSearchParams({id:String(game && game.id || ''), region:String(state.region||'TR')});
  if(game && game.conceptId) qs.set('conceptId', String(game.conceptId));
  fetch(`/api/game-regions?${qs.toString()}`, {cache:"no-store"})
    .then(r=>r.json())
    .then(j=>{
      const items = (j && j.items) || [];
      list.innerHTML = renderRegionCompareItems(items, state.region);
      const active = items.find(x=>String(x.region||'').toUpperCase()===String(state.region||'TR').toUpperCase()) || items.find(x=>Number(x.discPerc||0)>0 && x.discountedUntil) || null;
      if(active && active.discountedUntil) setCompareDiscountDate(active.discountedUntil);
    })
    .catch(()=>{ list.innerHTML = `<div class="regionCompareLoading">Не удалось загрузить сравнение</div>`; });
}
function closeRegionCompare(){
  const overlay=document.getElementById("regionCompareModal");
  if(!overlay) return;
  overlay.style.display="none";
  document.body.classList.remove("modalOpen");
}


function gmRuLabel(ru){
  const v = String(ru || 'none').toLowerCase();
  if(v === 'voice') return 'Русская озвучка и текст';
  if(v === 'text') return 'Русские субтитры';
  if(v === 'unknown') return 'Русский перевод: неизвестно';

}
function gmIsRuPositive(ru){ return String(ru||'').toLowerCase()==='voice' || String(ru||'').toLowerCase()==='text'; }

function gmPlayersText(g){
  const raw = String(g && g.players || '').trim();
  if(!raw) return '1 игрок';
  const n = raw.replace(/[–—]/g,'-').match(/^(\d+)(?:\s*-\s*(\d+))?/);
  if(!n) return raw;
  if(!n[2] && Number(n[1]) === 1) return '1 игрок';
  return raw;
}
function gmPlayersIconCount(playersText){
  const raw = String(playersText || '').replace(/[–—]/g,'-');
  const n = raw.match(/^(\d+)(?:\s*-\s*(\d+))?/);
  if(!n) return 1;
  const max = Number(n[2] || n[1] || 1);
  if(max >= 4) return 3;
  if(max >= 2) return 2;
  return 1;
}
function gmPlayersIconsHtml(count){

let __gmMediaItems=[];
let __gmMediaIndex=0;
function gmYoutubeId(rawUrl){
  const raw=String(rawUrl||'').trim();
  if(!raw) return '';
  try{
    const u=new URL(raw);
    const host=u.hostname.toLowerCase().replace(/^www\./,'');
    if(host==='youtu.be') return (u.pathname.split('/').filter(Boolean)[0]||'').slice(0,32);
    if(host==='youtube.com' || host==='m.youtube.com' || host==='music.youtube.com' || host==='youtube-nocookie.com'){
      if(u.pathname==='/watch') return (u.searchParams.get('v')||'').slice(0,32);
      const parts=u.pathname.split('/').filter(Boolean);
      if(['embed','shorts','live'].includes(parts[0])) return (parts[1]||'').slice(0,32);
    }
  }catch(_e){}
  return '';
}
function gmYoutubeEmbedUrl(rawUrl){
  const id=gmYoutubeId(rawUrl);
  return id ? `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1` : '';
}
function gmMediaThumbHtml(item, idx){
  const type=String(item&&item.type||'').toLowerCase();
  const url=String(item&&item.url||'');
  if(!url) return '';
  if(type==='video'){
    const ytId=gmYoutubeId(url);
    if(ytId){
      return `<button class="gmMediaThumb gmMediaThumbVideo" type="button" data-gm-media="${idx}" aria-label="Открыть трейлер"><img src="https://i.ytimg.com/vi/${encodeURIComponent(ytId)}/hqdefault.jpg" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"><span class="gmMediaPlay">▶</span><span class="gmMediaLabel">Трейлер</span></button>`;
    }
    return `<button class="gmMediaThumb gmMediaThumbVideo" type="button" data-gm-media="${idx}" aria-label="Открыть трейлер"><video src="${escapeHtml(url)}#t=0.1" muted preload="metadata" playsinline></video><span class="gmMediaPlay">▶</span><span class="gmMediaLabel">Трейлер</span></button>`;
  }
  return `<button class="gmMediaThumb" type="button" data-gm-media="${idx}" aria-label="Открыть скриншот"><img src="${escapeHtml(optimizedPsImageUrl(url,420))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer"></button>`;
}
function gmRenderMedia(game){
  const section=document.getElementById('gmMediaSection');
  const rail=document.getElementById('gmMediaRail');
  if(!section||!rail) return;
  const raw=Array.isArray(game&&game.mediaGallery)?game.mediaGallery:[];
  const videos=raw.filter(x=>String(x&&x.type||'').toLowerCase()==='video' && x.url).slice(0,3);
  const images=raw.filter(x=>String(x&&x.type||'').toLowerCase()==='image' && x.url).slice(0,6);
  __gmMediaItems=videos.concat(images);
  // Each opened game starts its media gallery from the first item.
  // The same modal/rail DOM node is reused between games, so without this
  // reset scrollLeft from the previously opened game is preserved.
  rail.scrollLeft = 0;
  __gmMediaIndex = 0;
  if(!__gmMediaItems.length){ section.style.display='none'; rail.innerHTML=''; return; }
  section.style.display='';
  rail.innerHTML=__gmMediaItems.map(gmMediaThumbHtml).join('');
  // Reset once more after thumbnails are in the DOM (important on mobile).
  requestAnimationFrame(()=>{ rail.scrollLeft = 0; });
  rail.querySelectorAll('[data-gm-media]').forEach(btn=>btn.onclick=()=>gmOpenMedia(Number(btn.getAttribute('data-gm-media')||0)));
}
function gmOpenMedia(idx){
  if(!__gmMediaItems.length) return;
  __gmMediaIndex=Math.max(0,Math.min(__gmMediaItems.length-1,Number(idx)||0));
  const lb=document.getElementById('gmMediaLightbox');
  if(!lb) return;
  lb.style.display='flex'; lb.setAttribute('aria-hidden','false');
  document.body.classList.add('modalOpen');
  gmRenderLightbox();
}
function gmRenderLightbox(){
  const stage=document.getElementById('gmMediaLbStage');
  const counter=document.getElementById('gmMediaLbCounter');
  if(!stage||!__gmMediaItems.length) return;
  const item=__gmMediaItems[__gmMediaIndex];
  const type=String(item.type||'').toLowerCase();
  if(type==='video'){
    const ytEmbed=gmYoutubeEmbedUrl(item.url);
    stage.innerHTML = ytEmbed
      ? `<iframe class="gmMediaYoutube" src="${escapeHtml(ytEmbed)}" title="Трейлер YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`
      : `<video src="${escapeHtml(item.url)}" controls autoplay playsinline preload="metadata"></video>`;
  }else{
    stage.innerHTML=`<img src="${escapeHtml(item.url)}" alt="Скриншот" referrerpolicy="no-referrer">`;
  }
  if(counter) counter.textContent=`${__gmMediaIndex+1} / ${__gmMediaItems.length}`;
}
function gmStepMedia(dir){ if(!__gmMediaItems.length)return; __gmMediaIndex=(__gmMediaIndex+dir+__gmMediaItems.length)%__gmMediaItems.length; gmRenderLightbox(); }
function gmCloseMedia(){
  const lb=document.getElementById('gmMediaLightbox'); if(!lb)return;
  lb.style.display='none'; lb.setAttribute('aria-hidden','true');
  const stage=document.getElementById('gmMediaLbStage'); if(stage) stage.innerHTML='';

  }

  const subEl=document.getElementById("gmSub");
  if(subEl){
    const s=String(game.sub||"").trim().toLowerCase();
    const isEa = (s==="eaplay" || s==="ea_play" || s==="ea");
    const isEssential = (s==="psplus_essential" || s==="ps_plus_essential" || s==="essential");
    const isExtra = (s==="psplus_extra" || s==="ps_plus_extra" || s==="extra" || s==="psplus");
    const isDeluxe = (s==="psplus_deluxe" || s==="ps_plus_deluxe" || s==="deluxe");
    if(!s || (!isEa && !isEssential && !isExtra && !isDeluxe)){
      subEl.style.display="none";
      subEl.innerHTML="";
    }else{
      const icon = isEa ? "/img/ea1.png" : "/img/psplus1.png";
      const text = isEa ? "Доступна в EaPlay" : (isEssential ? "Доступна в Essential" : (isDeluxe ? "Доступна в Deluxe" : "Доступна в Extra"));
      subEl.style.display="flex";
      subEl.innerHTML = `<img class="subIcon" src="${icon}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'"/><span>${text}</span>`;
    }
  }

  gmUpdatePlayersInfo(game);
  gmRenderMedia(game);

  if(relEl){
    const hasRel = !!(game && game.isPreorder && isFutureReleaseDate(game.releaseDate));
    relEl.style.display = hasRel ? "" : "none";
    relEl.textContent = hasRel ? `Релиз: ${formatDateDMY(game.releaseDate)}` : "";
  }
  if(disc) disc.textContent = game.discPerc ? (`-${game.discPerc}%`) : "";
  if(until) until.textContent = game.discountedUntil ? formatDateRuLong(game.discountedUntil) : "";
  if(price) price.textContent = fmtRub(game.finalPriceRub);
  if(oldPrice){
    oldPrice.style.display = Number(game.oldPriceRub||0) ? "" : "none";
    oldPrice.textContent = Number(game.oldPriceRub||0) ? fmtRub(game.oldPriceRub) : "";
  }
  const promoLine=document.getElementById('gmPromoLine');
  if(promoLine){
    const hasPromo = !!(game.discPerc || game.discountedUntil);
    promoLine.style.display = hasPromo ? '' : 'none';
  }

  if(descEl && readMoreEl){
    const descWrap = document.getElementById('gmDescWrap');
    const desc = String(game.description || '').trim();
    if(desc){
      let isOpen = false;
      const renderDesc = ()=>{
        if(descWrap) descWrap.style.display = '';
        descEl.textContent = desc;
        descEl.classList.toggle('isHidden', !isOpen);
        descEl.classList.toggle('isExpanded', isOpen);
        descEl.classList.remove('isFull');
        if(descWrap){
          descWrap.classList.remove('isEmpty');
          descWrap.classList.toggle('isExpanded', isOpen);
          descWrap.classList.remove('isFull');
        }
        readMoreEl.style.display = '';
        readMoreEl.textContent = isOpen ? 'Скрыть Описание' : 'Читать Описание';
      };
      readMoreEl.onclick = ()=>{
        isOpen = !isOpen;
        renderDesc();
      };
      renderDesc();
    }else{
      if(descWrap){
        descWrap.style.display = 'none';
        descWrap.classList.add('isEmpty');
      }
      descEl.textContent = '';
      descEl.classList.add('isHidden');
      readMoreEl.style.display = 'none';
    }
  }

  const renderEditions = (editions)=>{
    if(!editionsWrap || !editionsSection) return;
    const list = Array.isArray(editions) && editions.length ? editions : [game];
    editionsSection.style.display = list.length > 1 ? '' : 'none';
    editionsWrap.innerHTML = list.map(e=>gmRenderEditionItem(e, game.id)).join('');
    editionsWrap.querySelectorAll('.gmv2Edition[data-gmv2-edition]').forEach(card=>{
      card.onclick=()=>{
        const id = card.getAttribute('data-gmv2-edition');
        const next = list.find(x=>String(x.id||'')===String(id));
        if(next){
          next.editions = list;
          openGameModal(next);
        }
      };
    });
  };

  if(editionsWrap && editionsSection){
    renderEditions(Array.isArray(game.editions) && game.editions.length ? game.editions : [game]);
    if(!game.__editionsLoaded){
      const conceptId = String(game.conceptId || '').trim();
      const editionQs = new URLSearchParams({ region: state.region, id: String(game.id || '') });
      if(conceptId) editionQs.set('conceptId', conceptId);
      fetch(`/api/game-editions?${editionQs.toString()}`)
        .then(r=>r.ok?r.json():null)
        .then(j=>{
          if(j && Array.isArray(j.items) && j.items.length){
            const list = j.items;
            const freshCurrent = list.find(x=>String(x.id||'')===String(game.id||''));
            const selected = freshCurrent || list[0];

            // The card that opens the modal can be only a lightweight game object.
            // Use the full edition data immediately, so price/discount/cart block
            // and the selected edition text are filled before any click in "Другие издания".
            openGameModal(Object.assign({}, game, selected, { editions:list, __editionsLoaded:true }));
            return;
          }
        })
        .catch(()=>{});
    }
  }

  if(buy){
    buy.setAttribute("data-cart-game", String(game.id));
    buy.setAttribute("data-cart-label", "В корзину");
    buy.setAttribute("data-cart-label-in", "В корзине");
    setBuyBtnState(buy, isInCart(game.id, state.region));
    buy.onclick=()=>{
      const nowInCart = isInCart(game.id, state.region);
      if(nowInCart) removeFromCart(game.id);
      else addToCart(game);
      setBuyBtnState(buy, isInCart(game.id, state.region));

  }
  const gmWish=document.getElementById("gmWishBtn");
  if(gmWish){
    gmWish.setAttribute("data-wish-game", String(game.id));
    setWishBtnState(gmWish, isInWishlist(game.id, state.region));
    gmWish.onclick=()=>{ toggleWishlist(game); setWishBtnState(gmWish, isInWishlist(game.id, state.region)); };
  }

  overlay.style.display="flex";
  document.body.classList.add("modalOpen");
}

function isoToRuDateLong(iso){
  const s=String(iso||"").split("T")[0];
  const [y,m,d]=s.split("-").map(x=>parseInt(x,10));
  if(!y||!m||!d) return "";
  const months=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  return `${d} ${months[m-1]} ${y}`;
}

  }

  const gridEl = document.getElementById("discountBannersGrid");
  if(gridEl){
    if(!dates.length){
      gridEl.innerHTML = "<div class='card' style='padding:12px;'>Скидок пока нет</div>";

      for(const d of dates){

        gridEl.appendChild(card);
      }

  }

  // Carousel data (11 games total across all discount blocks)
  try{
    const qs=new URLSearchParams({tab:"discounts",region:state.region,page:"1",sort:state.sort,perPage:"11"});
    const j=await fetch(`/api/games?${qs.toString()}`).then(r=>r.json());
    const items=(j && j.items) ? j.items : [];
    const viewport=document.getElementById("allDealsTrack");
    if(viewport){
      viewport.innerHTML = "<div class='allDealsInner' id='allDealsInner'></div>";
      const inner = document.getElementById('allDealsInner');
      items.forEach(g=>{
        const el=document.createElement("div");
        el.className="allDealsItem";
        el.appendChild(buildCard(g, state.whatsapp||"", true));
        inner.appendChild(el);
      });
      // View All card at the end
      const view=document.createElement("div");
      view.className="allDealsItem";
      view.innerHTML = `<a href="#" class="allDealsViewCard"><div class="allDealsViewCardInner">Посмотреть все</div></a>`;
      view.querySelector("a").onclick=(e)=>{e.preventDefault(); state.allDeals=true; state.until=""; state.page=1; load();};
      inner.appendChild(view);

      // Adaptive carousel (no half-cards, no scrollbar) — like PS Store
      let index = 0;
      const leftBtn = allDeals.querySelector('.allDealsArrow.left');
      const rightBtn = allDeals.querySelector('.allDealsArrow.right');

      const getNum = (el, prop)=>{
        const v = getComputedStyle(el).getPropertyValue(prop);
        const n = parseFloat(String(v).trim());
        return Number.isFinite(n) ? n : 0;
      };

      const getPerView = ()=>{
        const pv = parseInt(String(getComputedStyle(viewport).getPropertyValue('--perView')||'').trim(),10);
        return Number.isFinite(pv) && pv>0 ? pv : 6;
      };

      const clamp = (v,min,max)=>Math.max(min, Math.min(max, v));

      const update = ()=>{
        const perView = getPerView();
        const gap = getNum(viewport, '--gap');
        const firstItem = inner.querySelector('.allDealsItem');
        const itemW = firstItem ? firstItem.getBoundingClientRect().width : 0;
        const step = itemW + gap;
        const maxIndex = Math.max(0, inner.children.length - perView);
        index = clamp(index, 0, maxIndex);
        inner.style.transform = `translate3d(${-index * step}px,0,0)`;

        if(leftBtn) leftBtn.disabled = index<=0;
        if(rightBtn) rightBtn.disabled = index>=maxIndex;
      };

      const moveBy = (delta)=>{ index += delta; update(); };
      if(leftBtn) leftBtn.onclick=()=>moveBy(-getPerView());
      if(rightBtn) rightBtn.onclick=()=>moveBy(getPerView());

      // Touch swipe
      let startX=0, startT=0, startIndex=0, dragging=false;
      const onStart = (clientX)=>{
        dragging=true;
        startX=clientX;
        startT=Date.now();
        startIndex=index;
        inner.style.transition='none';
      };
      const onMove = (clientX)=>{
        if(!dragging) return;
        const perView=getPerView();
        const gap=getNum(viewport,'--gap');
        const firstItem=inner.querySelector('.allDealsItem');
        const itemW=firstItem ? firstItem.getBoundingClientRect().width : 0;
        const step=itemW+gap;
        const dx = clientX - startX;
        inner.style.transform = `translate3d(${-(startIndex*step) + dx}px,0,0)`;
      };
      const onEnd = (clientX)=>{
        if(!dragging) return;
        dragging=false;
        inner.style.transition='';
        const dx = clientX - startX;
        const dt = Date.now()-startT;
        const abs = Math.abs(dx);
        // if quick swipe or large drag => move one card
        if(abs > 60 || (dt < 250 && abs > 30)){
          index = startIndex + (dx<0 ? 1 : -1);
        }else{
          index = startIndex;
        }
        update();
      };

      viewport.addEventListener('touchstart',(e)=>{ if(e.touches&&e.touches[0]) onStart(e.touches[0].clientX); }, {passive:true});
      viewport.addEventListener('touchmove',(e)=>{ if(e.touches&&e.touches[0]) onMove(e.touches[0].clientX); }, {passive:true});
      viewport.addEventListener('touchend',(e)=>{ const t=e.changedTouches&&e.changedTouches[0]; onEnd(t?t.clientX:startX); }, {passive:true});

      // Mouse drag (desktop)
      viewport.addEventListener('mousedown',(e)=>{ onStart(e.clientX); }, {passive:true});
      window.addEventListener('mousemove',(e)=>{ onMove(e.clientX); }, {passive:true});
      window.addEventListener('mouseup',(e)=>{ if(dragging) onEnd(e.clientX); }, {passive:true});

      // Keep it responsive
      inner.style.transition = 'transform .35s ease';
      update();
      window.addEventListener('resize', ()=>{ update(); }, {passive:true});
    }
  }catch(_){
    // ignore
  }
}


function topupRegionName(region){
  const R=String(region||state.region||"TR").toUpperCase();
  if(R==="PL") return "Польша";
  if(R==="IN") return "Индия";
  if(R==="TR") return "Турция";
  return "СНГ";
}
function buyTopupCardWhatsApp(card){
  if(!card) return;
  const amount=Number(card.amount||0);
  const rub=Number(card.rub||0);
  const lines=[];
  lines.push("Хочу купить карту пополнения:");
  lines.push(`Регион: ${topupRegionName(state.region)} (${state.region})`);
  lines.push(`Номинал: ${formatStoreCurrency(amount, state.region)}`);
  if(rub) lines.push(`Цена: ${fmtRub(rub)}`);
  openWhatsAppMessage(lines.join("\n"));
}

async function load(){
  // keep filters selected across pagination
  document.getElementById("region").value=state.region;
  updateRegionPicker();
  const __resultsBar=document.querySelector(".resultsBar");
  if(__resultsBar) __resultsBar.style.display="";
  const __gridForReset=document.getElementById("grid");
  if(__gridForReset) __gridForReset.classList.remove("topupPageGrid");
  // sort select options depend on active tab; value is set in setActiveTab/setSortOptionsForTab
  if(document.getElementById("platform")) document.getElementById("platform").value=state.platform||"";
  const searchEl=document.getElementById("search");
  const currentHeaderSearchValue=searchEl ? (searchEl.value || "") : "";
  if(state.tab === "search"){
    if(searchEl) searchEl.value=state.search||"";
    // На странице поиска раскрываем поле, если есть запрос.
    if(state.search) setSearchOpen(true);
  }else{
    // Старый поиск больше не должен фильтровать обычные разделы сайта.
    // Значение в поле можно оставить визуально, но в state.search оно не участвует.
    state.search="";
    if(searchEl) searchEl.value=currentHeaderSearchValue;
  }
  const meta=await fetch("/api/meta").then(r=>r.json());
  populateGenreFilters(meta && meta.genres);
  // Apply active tab UI (do not reset page when loading)
  const knownTabs = new Set(["home","preorders","new","discounts","allgames","subs","topup","bestsellers","multiplayer","search"]);
  if(!knownTabs.has(state.tab)) state.tab="home";
  setActiveTab(state.tab, {keepPage:true,keepUntil:true});

  if(meta){
    state.whatsapp = meta.settings?.whatsappLink || state.whatsapp || "https://wa.me/+79659556300";
    state.discountRates = meta.discountRates || state.discountRates || {TR:[],UA:[],PL:[],IN:[]};
    state.topupCards = meta.topupCards || state.topupCards || {TR:[],PL:[],IN:[]};
    state.useTurkeyTopupCards = !!meta.settings?.useTurkeyTopupCards;
    state.useIndiaTopupCards = meta.settings?.useIndiaTopupCards !== false;
    state.roundStep = Number(meta.settings?.roundStep || state.roundStep || 50);
  }

  if(state.tab==="search"){
    setSearchOpen(true, {page:true});
  }

  if(state.tab==="home" && !(state.search||"").trim()){
    await renderHome();
    return;
  }

  if(state.tab==="bestsellers" && !(state.search||"").trim()){
    await renderBestsellersPage();
    return;
  }

  if(state.tab==="multiplayer" && !(state.search||"").trim()){
    await renderMultiplayerPage();
    return;
  }

  if(state.tab==="topup" && !(state.search||"").trim()){
    await renderTopupPage();
    return;
  }

  // Discounts: old date-tabs were replaced by the overview page (banner cards + All Deals carousel)
  if(state.tab==="discounts" && !(state.search||"").trim()) await loadDiscountTabs();

  // Счётчик общего количества игр
  const totalEl=document.getElementById("gamesTotal");
  if(totalEl && meta){
    const totalCount = (state.tab==="allgames") ? (meta.allGamesTotal||0) : (state.tab==="discounts") ? (meta.total||0) : (state.tab==="preorders") ? (meta.preordersTotal||0) : 0;
    totalEl.textContent=`Найдено игр: ${totalCount}`;
  }
  const whatsapp=meta.settings?.whatsappLink||"https://wa.me/+79659556300";
  state.whatsapp = whatsapp;
  state.discountRates = meta.discountRates || {TR:[],UA:[],PL:[],IN:[]};
  state.topupCards = meta.topupCards || state.topupCards || {TR:[],PL:[],IN:[]};
  state.useTurkeyTopupCards = !!meta.settings?.useTurkeyTopupCards;
  state.useIndiaTopupCards = meta.settings?.useIndiaTopupCards !== false;
  state.roundStep = Number(meta.settings?.roundStep || 50);
  const showUntil=!!(state.tab==="discounts" && meta.hasAnyUntil && meta.hasAnyUntil[state.region]);

  // Discounts overview (no date selected, not "View All", and not searching)
  if(state.tab==="discounts" && !state.search && !state.until && !state.allDeals){
    document.body.dataset.discountsView = "overview";
    // On overview we show banners + carousel only
    const dt=document.getElementById('discountTabs');
    if(dt) dt.style.display = "";
    const ad=document.getElementById("allDeals");
    if(ad) ad.style.display="";
    await renderDiscountOverview();
    return;
  }

  // Discounts list views (by date / View All / search)
  if(state.tab === "discounts"){
    document.body.dataset.discountsView = "list";
    const dt=document.getElementById('discountTabs');
    if(dt){ dt.innerHTML=""; dt.style.display = "none"; }
  }

  // In date/all views, hide the All Deals carousel UI.
  const __ad=document.getElementById("allDeals");
  if(__ad){ __ad.innerHTML=""; __ad.style.display="none"; }

  // Если есть несколько блоков дат скидок, игры показываем только после выбора даты
  const needPickDate = false; // больше не скрываем игры: по умолчанию показываем ближайшую дату скидки
  const grid=document.getElementById("grid");
  if(grid) grid.classList.toggle("searchResults", !!(state.search||"").trim());
  const pager=document.getElementById("pager");
  const emptyBox=document.getElementById("emptyBox");

  if(state.tab === "search" && !String(state.search || "").trim()){
    const dt=document.getElementById('discountTabs');
    if(dt){ dt.innerHTML=""; dt.style.display="none"; }
    const ad=document.getElementById("allDeals");
    if(ad){ ad.innerHTML=""; ad.style.display="none"; }
    if(grid) grid.innerHTML="";
    if(pager) pager.innerHTML="";
    if(emptyBox){
      emptyBox.style.display="block";
      emptyBox.textContent="Вы ещё ничего не искали";
    }
    try{history.replaceState(null,"",`?tab=search&region=${encodeURIComponent(state.region)}`);}catch(_){}
    return;
  }

  // Reset special layouts applied by other sections
  if(grid) grid.classList.remove("gridSubs");
  if(needPickDate){
    if(grid) grid.innerHTML="";
    if(pager) pager.innerHTML="";
    if(emptyBox){
      emptyBox.style.display="block";
      emptyBox.textContent="Выберите дату скидки выше";
    }
    return;
  }



  // "Новинки" теперь загружаются с сервера (игры из "Всё игры" по PS категории)
  if(state.tab==="subs" && !(state.search||"").trim()){
    renderSubscriptions();
    return;
  }
  // Keep current section in URL so refresh stays on the same page/tab
  const qs=new URLSearchParams({tab:state.tab,region:state.region,page:String(state.page),sort:state.sort});
  if(state.tab==="subs" && state.subPage && !(state.search||"").trim()) qs.set("sub", state.subPage);
  // keep current state in URL (so refresh keeps page/filters)
  
  if(state.platform) qs.set("platform", state.platform);
  if(state.players) qs.set("players", state.players);
  if(state.language) qs.set("language", state.language);
  if((state.genres||[]).length) qs.set("genres", state.genres.join(","));
  if(state.search)qs.set("q",state.search);
  // During search, don't restrict by discount date. Search must run across all dates.
  if(!state.search && state.until)qs.set("until",state.until);
  if(state.tab==="discounts" && state.allDeals) qs.set("all","1");
  // keep current state in URL (so refresh keeps page/filters)
  try{history.replaceState(null,"",`?${qs.toString()}`);}catch(_){}
  // Choose API: when search is active -> global search across all games + preorders (subscriptions excluded).
  let apiPath;
  if(state.tab==="search" || (state.search||"").trim()){
    apiPath = "/api/search?";
    // When searching globally, do not restrict by discount date, "all deals" or subscription page.
    qs.delete("until"); qs.delete("all"); qs.delete("sub");
  }else if(state.tab==="allgames"){
    apiPath = "/api/allgames?";
  }else if(state.tab==="preorders"){
    apiPath = "/api/preorders?";
  }else if(state.tab==="new"){
    apiPath = "/api/newreleases?";
  }else if(state.tab==="subs"){
    apiPath = "/api/subgames?";
  }else{
    apiPath = "/api/games?";
  }
  const j=await fetch(apiPath+qs.toString()).then(r=>r.json());

  // If user switched region and current page became empty, jump to last available page
  if(j && (j.total||0)>0 && (j.items||[]).length===0 && state.page>1){
    const lastPage=Math.max(1, Math.ceil((j.total||0)/(j.perPage||36)));
    if(lastPage!==state.page){ state.page=lastPage; return load(); }
  }

  grid.innerHTML="";
  (j.items||[]).forEach(g=>grid.appendChild(buildCard(g,whatsapp,showUntil)));
  if(emptyBox){
    emptyBox.style.display = (j.total===0) ? "block" : "none";
    if(j.total===0) emptyBox.textContent="Игры еще не добавлены";
  }
  pager.innerHTML="";
  const totalPages = Math.max(1, Math.ceil((j.total||0) / (j.perPage||20)));

  const mk=(label,page,disabled=false,active=false)=>{
    const b=document.createElement("button");
    b.className="pagerBtn"+(active?" active":"");
    b.textContent=label;
    b.disabled=disabled;
    b.onclick=()=>{state.page=page;load();scrollTo(0,0)};
    return b;
  };

  // nothing to paginate
  if(totalPages<=1){
    // keep empty
  } else {
    // Prev
    pager.appendChild(mk("‹", Math.max(1, state.page-1), state.page===1));

    if(totalPages<=3){
      for(let p=1;p<=totalPages;p++){
        pager.appendChild(mk(String(p), p, false, p===state.page));
      }
    } else {
      // show a sliding window around current page
      const start = Math.max(1, state.page-1);
      const end   = Math.min(totalPages, state.page+1);

      for(let p=start;p<=end;p++){
        pager.appendChild(mk(String(p), p, false, p===state.page));
      }

      if(end < totalPages-1){
        const dots=document.createElement("span");
        dots.className="pagerDots";
        dots.textContent="…";
        pager.appendChild(dots);
      }

      // always show last page
      if(end < totalPages){
        pager.appendChild(mk(String(totalPages), totalPages, false, state.page===totalPages));
      }
    }

    // Next
    pager.appendChild(mk("›", Math.min(totalPages, state.page+1), state.page===totalPages));
  }
}
