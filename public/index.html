        <div class="gmv2Platform" id="gmPlatforms"></div>
      </div>

      <div class="gmv2Right">
        <div class="gmv2Title" id="gmTitle"></div>
        <div class="gmv2EditionText" id="gmEdition"></div>
        <div class="gmv2Badges">
          <div class="gmv2Ru" id="gmRu"></div>
          <div class="gmv2Sub" id="gmSub" style="display:none"></div>
        </div>
        <div class="gmv2Release" id="gmRelease" style="display:none"></div>
      </div>
    </div>

    <div class="gmv2DescWrap" id="gmDescWrap" style="display:none">
      <div class="gmv2ReadActions" id="gmReadActions">
        <button class="gmv2ReadMore" id="gmReadMore" type="button">Читать Описание</button>
      </div>
      <div class="gmv2Description isHidden" id="gmDescription"></div>
    </div>

    <div class="gmv2BuyPanel">
      <div class="gmv2PromoLine" id="gmPromoLine">
        <div class="gmv2PromoLeft"><div class="gmv2Discount" id="gmDiscount"></div><div class="gmv2Until" id="gmUntil"></div></div>
        <div class="gmv2PriceBox"><div class="gmv2Price" id="gmPrice"></div><div class="gmv2OldPrice" id="gmOldPrice"></div></div>
      </div>
      <div class="gmv2BuyRow">
        <button class="gmv2Wish" id="gmWishBtn" type="button" aria-label="В желаемое" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"/></svg></button>
        <div class="gmv2PlayersInfo" id="gmPlayersInfo"><span class="gmv2PlayersIcons"><span class="gmv2PlayerAvatar" aria-hidden="true"></span></span><span class="gmv2PlayersText">1 игрок</span></div>
        <button class="gmv2CartBtn" id="gmBuyBtn" type="button" aria-pressed="false">В корзину</button>
      </div>
    </div>

    <section class="gmv2MediaSection" id="gmMediaSection" style="display:none">
      <div class="gmv2MediaRail" id="gmMediaRail"></div>
    </section>

    <section class="gmv2EditionsSection" id="gmEditionsSection" style="display:none">
      <div class="gmv2SectionHead">
        <h3>Другие издания</h3>
        <!--<button class="gmv2Compare" type="button">⚖ Сравнить издания</button>-->
      </div>
      <div class="gmv2EditionsList" id="gmEditionsList"></div>
    </section>
  </div>
</div>

<div id="gmMediaLightbox" class="gmMediaLightbox" style="display:none" aria-hidden="true">
  <button class="gmMediaLbClose" id="gmMediaLbClose" type="button" aria-label="Закрыть">×</button>
  <button class="gmMediaLbNav gmMediaLbPrev" id="gmMediaLbPrev" type="button" aria-label="Назад">‹</button>
  <div class="gmMediaLbStage" id="gmMediaLbStage"></div>
  <button class="gmMediaLbNav gmMediaLbNext" id="gmMediaLbNext" type="button" aria-label="Вперёд">›</button>
  <div class="gmMediaLbCounter" id="gmMediaLbCounter"></div>
</div>

<div id="regionCompareModal" class="modalOverlay regionCompareOverlay" style="display:none">
  <div class="regionCompareCard" role="dialog" aria-modal="true" aria-label="Сравнение регионов">
    <button class="regionCompareClose" id="regionCompareClose" aria-label="Закрыть" type="button">×</button>
    <div class="regionCompareKicker">Сравнение регионов</div>
    <div class="regionCompareHead">
      <div class="regionCompareCover" id="regionCompareCover"></div>
      <div class="regionCompareHeadText">
        <div class="regionCompareTitle" id="regionCompareTitle"></div>
        <div class="regionCompareSub" id="regionCompareSub"></div>
        <div class="regionComparePlatform" id="regionComparePlatform"></div>
        <div class="regionCompareDiscountDate" id="regionCompareDiscountDate"></div>
      </div>
    </div>
    <div class="regionCompareList" id="regionCompareList"></div>
  </div>
</div>

<div id="wishOverlay" class="cartOverlay wishOverlay" style="display:none" aria-hidden="true">
  <div class="cartDrawer wishDrawer" role="dialog" aria-modal="true" aria-label="Список желаемого">
    <div class="cartHead"><div class="cartTitle">Желаемое <span class="cartRegion" id="wishRegion"></span></div><div class="cartHeadActions"><button class="btnGhost cartClearBtn" id="wishClearBtn" type="button">Очистить</button><button class="cartClose" id="wishCloseBtn" type="button" aria-label="Закрыть">×</button></div></div>
    <div class="cartBody" id="wishBody"></div>
  </div>
</div>

<div id="cartOverlay" class="cartOverlay" style="display:none" aria-hidden="true">
  <div class="cartDrawer" role="dialog" aria-modal="true" aria-label="Корзина">
    <div class="cartHead">
      <div class="cartTitle">Корзина <span class="cartRegion" id="cartRegion"></span></div>
      <div class="cartHeadActions">
        <button class="btnGhost cartClearBtn" id="cartClearBtn" type="button">Очистить</button>
        <button class="cartClose" id="cartCloseBtn" type="button" aria-label="Закрыть">×</button>
      </div>
    </div>
    <div class="cartBody" id="cartBody"></div>
    <div class="cartFoot">
      <div class="cartTotalRow cartOldTotalRow" id="cartOldTotalRow" style="display:none;">
        <div class="cartTotalLabel">Старая цена</div>
        <div class="cartTotalValue cartOldTotalValue" id="cartOldTotal">0 ₽</div>
      </div>
      <div class="cartTotalRow cartDiscountRow" id="cartDiscountRow" style="display:none;">
        <div class="cartTotalLabel">Скидка за 2+ игры</div>
        <div class="cartTotalValue cartDiscountValue" id="cartDiscount">0 ₽</div>
      </div>
      <div class="cartTotalRow">
        <div class="cartTotalLabel">Итого:</div>
        <div class="cartTotalValue" id="cartTotal">0 ₽</div>
      </div>
      <button class="buyBtn cartBuyBtn" id="cartBuyBtn" type="button">Купить</button>
      <div class="cartHint" id="cartHint"></div>
    </div>
  </div>
</div>

  <script src="/snow.js"></script>
</body></html>
